name: Release

# Questo workflow vive nel repo PUBBLICO delle release (es. cerchio-releases), non
# in quello del codice. Così solo chi ha accesso in scrittura a questo repo (tu)
# può pubblicare: i collaboratori del repo privato possono pushare tag quanto
# vogliono, ma non fanno partire nessuna release e non vedono le chiavi.
#
# Lo avvia `npm run release -- X.Y.Z` (con `gh workflow run`), oppure a mano da
# Actions → Release → Run workflow, indicando il tag (es. v0.3.0).
#
# Secrets di questo repo:  CODE_TOKEN (lettura del repo privato),
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Variabile:               CODE_REPO (es. De-Cri/cerchio)
# Li imposta `node scripts/secure-releases.mjs`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag del codice da pubblicare (es. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - id: v
        run: |
          TAG="v$(jq -r .version package.json)"
          if [ "$TAG" != "${{ inputs.ref }}" ]; then
            echo "::error::Il tag ${{ inputs.ref }} non corrisponde alla versione nel codice ($TAG)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Crea la release (se non esiste)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.v.outputs.tag }}
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" -R "${{ github.repository }}" \
            --title "Paper $TAG" \
            --notes "Windows: scarica il file -setup.exe. Linux: .AppImage (qualsiasi distro), .deb (Ubuntu/Debian) o .rpm (Fedora). Chi ha già l'app riceve l'aggiornamento in automatico."

  windows:
    needs: create-release
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Paper ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false

  linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Carica sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} -R "${{ github.repository }}" \
            release/*.AppImage release/*.deb release/*.rpm release/latest-linux.yml --clobber
