name: Release

# This workflow lives in the PUBLIC releases repo (e.g. feder-releases), not in
# the code repo. This way only whoever can write to this repo (you) can publish:
# collaborators on the code repo can push as many tags as they want, but they
# can't start a release and can't see the keys.
#
# Started by `npm run release -- X.Y.Z` (with `gh workflow run`), or by hand from
# Actions → Release → Run workflow, giving the tag (e.g. v0.3.0).
#
# Secrets of this repo:    CODE_TOKEN (read access to the code repo),
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Variable:                CODE_REPO (e.g. De-Cri/feder)
# Set by `node scripts/secure-releases.mjs`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag del codice da pubblicare (es. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - id: v
        run: |
          TAG="v$(jq -r .version package.json)"
          if [ "$TAG" != "${{ inputs.ref }}" ]; then
            echo "::error::Il tag ${{ inputs.ref }} non corrisponde alla versione nel codice ($TAG)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Crea la release (se non esiste)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.v.outputs.tag }}
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create "$TAG" -R "${{ github.repository }}" \
            --title "Feder $TAG" \
            --notes "🇮🇹 Windows: scarica il file -setup.exe. Linux: .AppImage (qualsiasi distro), .deb (Ubuntu/Debian) o .rpm (Fedora). Chi ha già l'app riceve l'aggiornamento in automatico.<br><br>🇬🇧 Windows: download the -setup.exe file. Linux: .AppImage (any distro), .deb (Ubuntu/Debian) or .rpm (Fedora). If you already have the app, the update arrives automatically."

  windows:
    needs: create-release
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Feder ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false

  linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Carica sulla release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} -R "${{ github.repository }}" \
            release/*.AppImage release/*.deb release/*.rpm release/latest-linux.yml --clobber
