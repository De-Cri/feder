name: Keep-alive

# Supabase's free tier pauses the project after ~7 days without activity:
# one request a day keeps it awake.
# GitHub disables scheduled workflows after 60 days without commits: on the
# first of the month this workflow makes an empty commit to prevent that.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(jq -r .supabaseUrl cerchio.config.json)
          KEY=$(jq -r .supabaseAnonKey cerchio.config.json)
          curl -fsS "$URL/rest/v1/rpc/is_member" -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
      - name: Tieni attivo il repo (1° del mese)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "cerchio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive"
            git push
          fi
