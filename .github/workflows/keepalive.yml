name: Keep-alive

# Il piano free di Supabase mette in pausa il progetto dopo ~7 giorni senza
# attività: una richiesta al giorno lo tiene sveglio.
# GitHub disattiva i workflow schedulati dopo 60 giorni senza commit: il primo
# del mese questo workflow fa un commit vuoto per evitarlo.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(jq -r .supabaseUrl cerchio.config.json)
          KEY=$(jq -r .supabaseAnonKey cerchio.config.json)
          curl -fsS "$URL/rest/v1/rpc/is_member" -X POST \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          echo
      - name: Tieni attivo il repo (1° del mese)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "cerchio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive"
            git push
          fi
