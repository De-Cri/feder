name: Release

# Il codice sta in questo repo (privato); gli installer vengono pubblicati nel
# repo pubblico vars.RELEASES_REPO (solo download, niente codice) usando il
# secret RELEASES_TOKEN. Entrambi li imposta `npm run setup`.
#
# Pubblica una release con:
#   - Windows: installer Tauri (.exe / .msi) + latest.json per l'aggiornamento automatico
#   - Linux:   Electron (.AppImage / .deb / .rpm) + latest-linux.yml per l'aggiornamento
# Parte quando viene pushato un tag vX.Y.Z (lo fa `npm run release -- X.Y.Z`)
# o a mano da Actions → Release → Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      owner: ${{ steps.v.outputs.owner }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REPO: ${{ vars.RELEASES_REPO }}
        run: |
          test -n "$REPO" || { echo "::error::Variabile RELEASES_REPO mancante: esegui npm run setup"; exit 1; }
          echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "owner=${REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >> "$GITHUB_OUTPUT"
      - name: Crea la release (se non esiste)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: ${{ vars.RELEASES_REPO }}
        run: |
          TAG=${{ steps.v.outputs.tag }}
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || gh release create "$TAG" -R "$REPO" \
            --title "Cerchio $TAG" \
            --notes "Windows: scarica il file .exe. Linux: .AppImage (qualsiasi distro), .deb (Ubuntu/Debian) o .rpm (Fedora). Chi ha già l'app riceve l'aggiornamento in automatico."

  windows:
    needs: create-release
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: ${{ needs.create-release.outputs.owner }}
          repo: ${{ needs.create-release.outputs.name }}
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: 'Cerchio ${{ needs.create-release.outputs.tag }}'
          releaseDraft: false
          prerelease: false

  linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: Carica su GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} -R "${{ vars.RELEASES_REPO }}" \
            release/*.AppImage release/*.deb release/*.rpm release/latest-linux.yml --clobber
